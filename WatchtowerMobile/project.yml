name: WatchtowerMobile

options:
  bundleIdPrefix: com.aiwatchtowers.watchtower
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # xcuserdata is machine-local (window state, breakpoints) — never commit it.
  xcodeVersion: "16.0"

packages:
  WatchtowerKit:
    path: ../WatchtowerKit

settings:
  base:
    # Simulator / generic builds only in v1 — no signing until entitlements land.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  WatchtowerMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: WatchtowerKit
        product: WatchtowerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiwatchtowers.watchtower.mobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # SwiftUI-generated launch screen (UILaunchScreen empty dict equivalent).
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

schemes:
  WatchtowerMobile:
    build:
      targets:
        WatchtowerMobile: all
    run:
      config: Debug
    archive:
      config: Release
