name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:

# One live run per branch: the push- and pull_request-triggered runs of the
# same head land in the same group (the PR event carries head.ref, the push
# event ref_name), so the newer cancels the older instead of running twice —
# and rapid successive pushes cancel their stale predecessors.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: "v2.11.4"
          args: --timeout=5m

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test (race, library packages)
        # Race-instrumented pure-Go sqlite is ~10x slower; internal/db is the
        # long pole (~7min on shared runners), so keep the generous timeout.
        run: go test $(go list ./... | grep -v '^watchtower/cmd$') -race -count=1 -timeout 25m

      - name: Test (cmd, no race)
        # cmd is CLI glue over file-backed SQLite fixtures — under -race it
        # alone took ~13min on shared runners while its concurrency all lives
        # in internal/*, which stays race-covered above.
        run: go test ./cmd/ -count=1 -timeout 10m

      - name: Build
        run: go build ./...

      - name: Coverage gate
        run: make test-cover

  swift-lint:
    name: Swift Lint
    runs-on: macos-15
    defaults:
      run:
        working-directory: WatchtowerDesktop
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json

  swift-test:
    name: Swift Test
    runs-on: macos-15
    defaults:
      run:
        working-directory: WatchtowerDesktop
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  sentrux-quality:
    name: Sentrux Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sentrux
        run: curl -fsSL https://raw.githubusercontent.com/sentrux/sentrux/main/install.sh | sh

      # check enforces .sentrux/rules.toml (max_cc, max_fn_lines, no_god_files).
      - name: Architectural rules
        run: sentrux check .

      # gate blocks any structural regression vs .sentrux/baseline.json.
      - name: Structural regression gate
        run: sentrux gate .
