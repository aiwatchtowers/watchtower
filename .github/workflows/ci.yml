name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
  # Manual escape hatch: lets a maintainer force a real run (bypassing the
  # `gate` job's push-vs-pull_request dedupe below, since its event_name
  # isn't "push") when a PR's pull_request-triggered run never materializes.
  workflow_dispatch:

# One live run per branch and event: rapid successive pushes (or PR syncs)
# cancel their stale predecessors. Cross-event dedupe (push vs pull_request
# firing together on a PR branch) is handled by the `gate` job below —
# skipping shows neutral in the PR, unlike a cancelled run's red X.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Skips the push-triggered run when the branch has an open PR — the
  # pull_request-triggered run of the same commit does the work instead.
  gate:
    name: Dedupe gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${GITHUB_REF_NAME}" --state open --json number --jq length)
            if [ "$open_prs" -gt 0 ]; then
              echo "branch has an open PR — the pull_request run covers this commit"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  go-lint:
    name: Go Lint
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: "v2.11.4"
          args: --timeout=5m

  go-test:
    name: Go Test
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test (race, library packages)
        # Race-instrumented pure-Go sqlite is ~10x slower; internal/db is the
        # long pole (~7min on shared runners), so keep the generous timeout.
        run: go test $(go list ./... | grep -v '^watchtower/cmd$') -race -count=1 -timeout 25m

      - name: Test (cmd, no race)
        # cmd is CLI glue over file-backed SQLite fixtures — under -race it
        # alone took ~13min on shared runners while its concurrency all lives
        # in internal/*, which stays race-covered above.
        run: go test ./cmd/ -count=1 -timeout 10m

      - name: Build
        run: go build ./...

      - name: Coverage gate
        run: make test-cover

  swift-lint:
    name: Swift Lint
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: WatchtowerDesktop
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json

  swift-test:
    name: Swift Test
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: WatchtowerDesktop
    steps:
      - uses: actions/checkout@v4

      # The runner's default toolchain (Xcode 16.4) predates the macOS 26 SDK, so
      # any reference to Speech's SpeechTranscriber/SpeechAnalyzer/AssetInventory/
      # AnalyzerInput (AppleProvider.swift) fails to compile with "cannot find type
      # in scope" rather than an availability diagnostic. Xcode 26.3 is installed on
      # this image (non-default) and ships the macOS 26 SDK those declarations live
      # in; selecting it lets the file weak-link as designed without needing a
      # macOS-26 runner to execute the guarded code.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  sentrux-quality:
    name: Sentrux Quality Gate
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sentrux
        run: curl -fsSL https://raw.githubusercontent.com/sentrux/sentrux/main/install.sh | sh

      # check enforces .sentrux/rules.toml (max_cc, max_fn_lines, no_god_files).
      - name: Architectural rules
        run: sentrux check .

      # gate blocks any structural regression vs .sentrux/baseline.json.
      - name: Structural regression gate
        run: sentrux gate .
