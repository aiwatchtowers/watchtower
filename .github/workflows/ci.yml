name: CI

on:
  push:
    branches: [main, mobile-app, feature/*]
  pull_request:
    branches: [main, mobile-app]

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: "v2.11.4"
          args: --timeout=5m

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: go build ./...

      - name: Coverage gate
        run: make test-cover

  swift-lint:
    name: Swift Lint
    runs-on: macos-15
    defaults:
      run:
        working-directory: WatchtowerDesktop
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json

  swift-test:
    name: Swift Test
    runs-on: macos-15
    defaults:
      run:
        working-directory: WatchtowerDesktop
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  kit-lint:
    name: WatchtowerKit Lint
    runs-on: macos-15
    defaults:
      run:
        working-directory: WatchtowerKit
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict

  kit-test:
    name: WatchtowerKit Test
    runs-on: macos-15
    defaults:
      run:
        working-directory: WatchtowerKit
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  mobile-build:
    name: WatchtowerMobile Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # xcodegen is NOT needed: the .xcodeproj is committed (generated from
      # WatchtowerMobile/project.yml, the source of truth).
      - name: Build
        run: >
          xcodebuild build
          -project WatchtowerMobile/WatchtowerMobile.xcodeproj
          -scheme WatchtowerMobile
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      # Runtime smoke tests (WatchtowerMobileTests) — a `build` cannot catch the
      # ValueObservation reentrancy class of bug that crashed the tabs on-device
      # in Task 5; only running on a booted simulator does. The device name
      # varies by runner image (the macos-15 image's default Xcode ships iPhone
      # 16-class sims; our local box runs iPhone 17 Pro under Xcode 26), so we
      # pick the first AVAILABLE iPhone simulator at runtime and target OS=latest
      # rather than hardcoding a name that may not exist on the runner.
      - name: Test (simulator)
        run: |
          DEVICE=$(xcrun simctl list devices available \
            | grep -E 'iPhone' | head -1 | sed -E 's/^ *//; s/ \(.*//')
          echo "Selected simulator: ${DEVICE:-<none found>}"
          test -n "$DEVICE" || { echo "No iPhone simulator available on this runner"; exit 1; }
          xcodebuild test \
            -project WatchtowerMobile/WatchtowerMobile.xcodeproj \
            -scheme WatchtowerMobile \
            -destination "platform=iOS Simulator,OS=latest,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

  sentrux-quality:
    name: Sentrux Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sentrux
        run: curl -fsSL https://raw.githubusercontent.com/sentrux/sentrux/main/install.sh | sh

      # check enforces .sentrux/rules.toml (max_cc, max_fn_lines, no_god_files).
      - name: Architectural rules
        run: sentrux check .

      # gate blocks any structural regression vs .sentrux/baseline.json.
      - name: Structural regression gate
        run: sentrux gate .
