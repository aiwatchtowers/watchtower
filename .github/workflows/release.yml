name: Release

# Verification gate for release tags: the full suite including the -race
# pass that feature-branch CI skips. Artifact builds (app bundle, DMG,
# signing) stay local via scripts/build-app.sh — this workflow only decides
# whether the tagged commit is fit to ship.
on:
  push:
    tags: ["v*"]

jobs:
  go-release-gate:
    name: Go Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      # Same pairing as ci.yml's Go Test job: the shell suite over
      # scripts/build-app.sh runs first (seconds), then the coverage gate.
      - name: Test (shell scripts)
        run: make test-scripts

      - name: Test + coverage gate
        run: make test-cover

      - name: Test (race, library packages)
        # Same scope as the main-branch race pass in ci.yml: cmd is CLI glue
        # whose concurrency lives in internal/*, already covered here.
        run: go test $(go list ./... | grep -v '^watchtower/cmd$') -race -count=1 -timeout 25m

  swift-test:
    name: Swift Test
    runs-on: macos-15
    defaults:
      run:
        working-directory: WatchtowerDesktop
    steps:
      - uses: actions/checkout@v4

      # Same as ci.yml: the default Xcode 16.4 toolchain predates the macOS 26
      # SDK that AppleProvider.swift's Speech declarations weak-link against.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: WatchtowerDesktop/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('WatchtowerDesktop/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Test
        run: swift test
