name: Release

# Verification gate for release tags: the full suite including the -race
# pass that feature-branch CI skips. Artifact builds (app bundle, DMG,
# signing) stay local via scripts/build-app.sh — this workflow only decides
# whether the tagged commit is fit to ship.
on:
  push:
    tags: ["v*"]

jobs:
  go-release-gate:
    name: Go Release Gate
    runs-on: ubuntu-latest
    # A hang must fail the gate, not run to GitHub's 6 h default. The step
    # budgets (code index 20 + coverage 25 = 45) plus ~10 for setup and
    # build, so the job cap never cuts a step short of its own timeout.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      # internal/sqlcipher links OpenSSL's libcrypto on Linux (the shipped
      # macOS build uses CommonCrypto); install it explicitly so a runner
      # image change cannot break the cgo build quietly.
      - name: Install libssl-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      # -tags codegrammars: the release CLI carries the code index's full
      # grammar set (scripts/build-app.sh builds it the same way).
      - name: Build
        run: go build -tags codegrammars ./...

      - name: Test (code index, full grammar set)
        timeout-minutes: 20
        run: make test-codeindex-full

      # Same pairing as ci.yml's Go Test job: the shell suite over
      # scripts/build-app.sh runs first (seconds), then the coverage gate.
      - name: Test (shell scripts)
        run: make test-scripts

      - name: Test + coverage gate
        timeout-minutes: 25
        run: make test-cover

  # Mirrors ci.yml's go-test-race job — the same three shards of `make
  # test-race SHARD=K/3` (cmd out, internal/db's migration tests without
  # -race), in parallel: the unsharded pass outgrew one 40-minute step.
  go-release-race:
    name: Go Release Race (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      # internal/sqlcipher links OpenSSL's libcrypto on Linux (the shipped
      # macOS build uses CommonCrypto); install it explicitly so a runner
      # image change cannot break the cgo build quietly.
      - name: Install libssl-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Test (race, library packages)
        timeout-minutes: 30
        run: make test-race SHARD=${{ matrix.shard }}/3

  # Mirrors ci.yml's swift-test job — keep the two in step (runner, Xcode,
  # Go, cache, steps, timeouts). The release gate drifted once: it stayed on
  # macos-15 + Xcode 26.3 after ci.yml moved, and v0.14.0's cold SPM resolve
  # failed on mlx-swift's swift-tools-version 6.3.
  swift-test:
    name: Swift Test
    # macos-26: its image carries Xcode 26.4+ (Swift 6.3). The pinned mlx-swift
    # 0.31.6 (via speech-swift) declares swift-tools-version 6.3, which Xcode
    # 26.3 (Swift 6.2.4, the newest on macos-15) cannot load.
    runs-on: macos-26
    # A hang must fail the job, not run to GitHub's 6 h default. Measured
    # ~8 min in ci.yml, up to ~12; the margin is for a cold SPM cache.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: WatchtowerDesktop
    steps:
      - uses: actions/checkout@v4

      # The image's default toolchain may predate the macOS 26 SDK that
      # AppleProvider.swift's Speech declarations weak-link against, and the
      # Swift 6.3 toolchain is what mlx-swift's manifest needs.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      # CodeNavRealCLITests builds the CLI from this checkout (go build .):
      # the Go the other jobs use (go.mod needs 1.26), so the suite runs here
      # instead of skipping or failing.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: WatchtowerDesktop/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('WatchtowerDesktop/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Test
        timeout-minutes: 20
        env:
          # SQLCipherInteropTests fail instead of skipping without Go (#603).
          WATCHTOWER_REQUIRE_GO: "1"
        run: swift test

      # The process-spawning suites again on a one-thread concurrency pool,
      # so blocking I/O that slips back onto pool threads fails here.
      - name: Test (strict concurrency pool)
        timeout-minutes: 10
        working-directory: .
        run: make test-swift-strict-pool
