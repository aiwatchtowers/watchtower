<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stale Data Line</title>
<style>
/* Four iPhone frames of the Workbench tab, one per state of the stale-data line (#1873). */
:root {
  --page: #eceef1; --ink: #1d2128; --muted: #6b7280; --phone: #ffffff; --card: #f4f5f7;
  --line: #d9dce1; --green: #1f8a4c; --gray: #8e8e93; --callout: #d6336c;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #15171b; --ink: #e7e9ee; --muted: #9aa1ad; --phone: #000; --card: #1c1c1e; --line: #353941;
  --green: #4cc782; --gray: #8e8e93; --callout: #ff6b9a; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #15171b; --ink: #e7e9ee; --muted: #9aa1ad; --phone: #000; --card: #1c1c1e; --line: #353941;
  --green: #4cc782; --gray: #8e8e93; --callout: #ff6b9a; color-scheme: dark }
body { background: var(--page); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 1.6rem; margin: 0 0 6px; }
.lede { color: var(--muted); margin: 0 0 28px; max-width: 70ch; line-height: 1.5; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px; }
figure { margin: 0; }
figcaption { margin-top: 10px; line-height: 1.45; font-size: 14px; }
figcaption b { display: block; }
.phone { background: var(--phone); border: 1px solid var(--line); border-radius: 34px; padding: 18px 14px; height: 520px;
  box-shadow: 0 8px 28px rgba(0,0,0,.10); font-size: 13px; overflow: hidden; }
.nav { font-size: 26px; font-weight: 700; margin: 26px 2px 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 99px; padding: 6px 12px; color: var(--muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.dot.gray { background: var(--gray); }
.fresh { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin: 8px 2px 0; position: relative; }
.fresh::after { content: attr(data-n); position: absolute; right: -4px; top: -2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--callout); color: #fff; font: 600 10px/16px -apple-system, sans-serif; text-align: center; }
.sec { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin: 16px 2px 8px; }
.card { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.card b { display: block; margin-bottom: 4px; }
.card span { color: var(--muted); font-size: 12px; }
.empty { text-align: center; color: var(--muted); margin-top: 90px; line-height: 1.5; }
.empty b { color: var(--ink); display: block; font-size: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Workbench tab: how old the data is</h1>
  <p class="lede">The list of workbenches in each state. One workbench's screen puts the same line as its first row. Now is unchanged (its tower chip already says "asleep · last seen").</p>
  <div class="grid">
    <figure>
      <div class="phone">
        <div class="nav">Workbenches</div>
        <span class="chip"><span class="dot"></span>Acme Mac · online</span>
        <div class="sec">2 folders on your tower</div>
        <div class="card"><b>watchtower</b><span>2 working · 1 waiting</span></div>
        <div class="card"><b>docs</b><span>idle</span></div>
      </div>
      <figcaption><b>1. Fresh</b>Heartbeat under 35 min old, Relay answers: no line.</figcaption>
    </figure>
    <figure>
      <div class="phone">
        <div class="nav">Workbenches</div>
        <span class="chip"><span class="dot gray"></span>Acme Mac · asleep · last seen 2 h ago</span>
        <div class="fresh" data-n="1">⟲ Updated 15:20 · Acme Mac is not sending updates</div>
        <div class="sec">2 folders on your tower</div>
        <div class="card"><b>watchtower</b><span>2 working · 1 waiting</span></div>
        <div class="card"><b>docs</b><span>idle</span></div>
      </div>
      <figcaption><b>2. Stale</b>Heartbeat 35 min old or more. Secondary caption, never orange.</figcaption>
    </figure>
    <figure>
      <div class="phone">
        <div class="nav">Workbenches</div>
        <span class="chip"><span class="dot"></span>Acme Mac · online</span>
        <div class="fresh" data-n="2">⟲ Updated 15:20 · this iPhone can't reach Relay</div>
        <div class="sec">2 folders on your tower</div>
        <div class="card"><b>watchtower</b><span>2 working · 1 waiting</span></div>
        <div class="card"><b>docs</b><span>idle</span></div>
      </div>
      <figcaption><b>3. Offline</b>Relay does not answer this iPhone; wins over stale.</figcaption>
    </figure>
    <figure>
      <div class="phone">
        <div class="nav">Workbenches</div>
        <span class="chip"><span class="dot gray"></span>Your tower · offline</span>
        <div class="empty"><b>No workbenches yet</b>Your tower's workbenches show up here.</div>
      </div>
      <figcaption><b>4. Loading / empty</b>No heartbeat yet or not linked: no line, the empty state stands.</figcaption>
    </figure>
  </div>
</div>
</body>
</html>
