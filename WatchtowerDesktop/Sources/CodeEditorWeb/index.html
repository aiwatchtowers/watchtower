<!doctype html>
<!--
  POC (code viewer): the Monaco host page, served by CodeEditorSchemeHandler
  under wtcode://editor/. Swift drives it through window.wt; the page reports
  back through webkit.messageHandlers.wt with {type: ...} messages:
    ready                      — Monaco loaded, show() may be called
    text    {path, text, now}  — a file's text after an edit: debounced while
                                 typing, at once (now: true on Cmd+S) on a tab
                                 switch, a blur or Cmd+S. Swift saves it.
    error   {message}          — load failure or an uncaught script error
  One model per open file, so each keeps its own undo stack, cursor and
  scroll position across tab switches.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body, #editor { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #ffffff; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e1e; } }
  #missing { display: none; font: 13px -apple-system, sans-serif; color: #888; padding: 16px; }
</style>
</head>
<body>
<div id="editor"></div>
<div id="missing">Monaco is not installed. Run <code>scripts/fetch-monaco.sh</code> and rebuild.</div>
<script>
  function post(message) {
    try { window.webkit.messageHandlers.wt.postMessage(message); } catch (e) {}
  }
  window.addEventListener("error", function (e) { post({ type: "error", message: String(e.message || e) }); });
</script>
<script src="languages.js"></script>
<script src="vs/loader.js" onerror="document.getElementById('missing').style.display='block'; post({type:'error', message:'Monaco is not installed'})"></script>
<script>
(function () {
  if (typeof require === "undefined") { return; }
  require.config({ paths: { vs: "vs" } });
  require(["vs/editor/editor.main"], function () {
    registerExtraLanguages();

    // The TypeScript worker is trimmed from the bundle (fetch-monaco.sh):
    // switch the TS/JS language service off so nothing asks for it.
    // Highlighting comes from the Monarch grammars and stays.
    var ts = (monaco.typescript || (monaco.languages && monaco.languages.typescript));
    if (ts) {
      var off = { completionItems: false, hovers: false, documentSymbols: false, definitions: false,
        references: false, documentHighlights: false, rename: false, diagnostics: false,
        documentRangeFormattingEdits: false, signatureHelp: false, onTypeFormattingEdits: false,
        codeActions: false, inlayHints: false };
      [ts.typescriptDefaults, ts.javascriptDefaults].forEach(function (d) {
        if (!d) { return; }
        if (d.setModeConfiguration) { d.setModeConfiguration(off); }
        if (d.setDiagnosticsOptions) { d.setDiagnosticsOptions({ noSemanticValidation: true, noSyntaxValidation: true }); }
      });
    }

    var dark = window.matchMedia("(prefers-color-scheme: dark)");
    function applyTheme() { monaco.editor.setTheme(dark.matches ? "wt-dark" : "wt-light"); }
    applyTheme();
    dark.addEventListener("change", applyTheme);

    var editor = monaco.editor.create(document.getElementById("editor"), {
      automaticLayout: true,
      fontFamily: "SF Mono, Menlo, monospace",
      fontSize: 12,
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      renderWhitespace: "selection",
      model: null
    });
    var models = {};      // path -> model
    var viewStates = {};  // path -> saved cursor/scroll
    var pending = {};     // path -> debounce timer of an unsent edit
    var current = null;   // path on screen

    function send(path, now) {
      clearTimeout(pending[path]);
      delete pending[path];
      var model = models[path];
      if (model) { post({ type: "text", path: path, text: model.getValue(), now: !!now }); }
    }

    function flush(now) {
      Object.keys(pending).forEach(function (path) { send(path, false); });
      if (now && current) { send(current, true); }
    }

    function modelFor(path, text) {
      if (models[path]) { return models[path]; }
      var uri = monaco.Uri.file(path);
      var stale = monaco.editor.getModel(uri);
      if (stale) { stale.dispose(); }
      var model = monaco.editor.createModel(text, undefined, uri);
      model.setEOL(text.indexOf("\r\n") >= 0 ? monaco.editor.EndOfLineSequence.CRLF : monaco.editor.EndOfLineSequence.LF);
      model.onDidChangeContent(function (event) {
        if (model.__reloading) { return; }
        clearTimeout(pending[path]);
        pending[path] = setTimeout(function () { send(path, false); }, 300);
      });
      models[path] = model;
      return model;
    }

    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () { flush(true); });
    window.addEventListener("blur", function () { flush(false); });

    window.wt = {
      // Puts `path` on screen: its model when it has one (undo, cursor and
      // scroll as left), else a new one from `text` — the buffer's text,
      // which may carry unsaved edits from an earlier pane.
      show: function (args) {
        if (current === args.path && editor.getModel()) { return; }
        flush(false);
        if (current && models[current]) { viewStates[current] = editor.saveViewState(); }
        var model = modelFor(args.path, args.text);
        editor.setModel(model);
        if (viewStates[args.path]) { editor.restoreViewState(viewStates[args.path]); }
        current = args.path;
        editor.focus();
      },
      // The tab closed (or a preview tab was replaced): an edit still in
      // the debounce goes out first, saved at once, then the model goes.
      close: function (path) {
        if (pending[path]) { send(path, true); }
        if (models[path]) {
          if (current === path) { editor.setModel(null); current = null; }
          models[path].dispose();
          delete models[path];
        }
        delete viewStates[path];
      },
      // The file changed on disk and the buffer was clean: replace the text
      // as one undoable edit, so the view (scroll, cursor) mostly stays.
      reload: function (path, text) {
        var model = models[path];
        if (!model || model.getValue() === text) { return; }
        model.__reloading = true;
        model.pushEditOperations([], [{ range: model.getFullModelRange(), text: text }], function () { return null; });
        model.__reloading = false;
      },
      flush: function () { flush(false); },
      focus: function () { editor.focus(); }
    };
    post({ type: "ready" });
  }, function (err) {
    post({ type: "error", message: "Monaco failed to load: " + String(err && err.message || err) });
  });
})();
</script>
</body>
</html>
