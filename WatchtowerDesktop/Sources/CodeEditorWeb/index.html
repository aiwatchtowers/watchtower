<!doctype html>
<!--
  POC (code viewer): the Monaco host page, served by CodeEditorSchemeHandler
  under wtcode://editor/. Swift drives it through window.wt; the page reports
  back through webkit.messageHandlers.wt with {type: ...} messages:
    ready                      — Monaco loaded, open() may be called
    dirty   {dirty}            — the buffer differs (or no longer) from the last save point
    text    {text}             — the buffer's text, debounced, so Swift keeps unsaved edits
    save    {text}             — Cmd+S; Swift writes the file, then calls markSaved()
    error   {message}          — load failure or an uncaught script error
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body, #editor { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #ffffff; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e1e; } }
  #missing { display: none; font: 13px -apple-system, sans-serif; color: #888; padding: 16px; }
</style>
</head>
<body>
<div id="editor"></div>
<div id="missing">Monaco is not installed. Run <code>scripts/fetch-monaco.sh</code> and rebuild.</div>
<script>
  function post(message) {
    try { window.webkit.messageHandlers.wt.postMessage(message); } catch (e) {}
  }
  window.addEventListener("error", function (e) { post({ type: "error", message: String(e.message || e) }); });
</script>
<script src="vs/loader.js" onerror="document.getElementById('missing').style.display='block'; post({type:'error', message:'Monaco is not installed'})"></script>
<script>
// Monaco ships no dotenv grammar: .env, .env.local, prod.env, ...
// KEY=value lines, `export`, # comments, quoted values with ${VAR}.
function registerDotenv() {
  monaco.languages.register({
    id: "dotenv",
    aliases: ["dotenv", "env"],
    extensions: [".env"],
    filenames: [".env"],
    filenamePatterns: [".env.*", "*.env"]
  });
  monaco.languages.setLanguageConfiguration("dotenv", {
    comments: { lineComment: "#" },
    autoClosingPairs: [{ open: "\"", close: "\"" }, { open: "'", close: "'" }, { open: "{", close: "}" }]
  });
  monaco.languages.setMonarchTokensProvider("dotenv", {
    tokenizer: {
      root: [
        [/^\s*#.*$/, "comment"],
        [/^(\s*)(export)(\s+)([A-Za-z_][\w.\-]*)(\s*)(=)/, ["", "keyword", "", "variable", "", "delimiter"]],
        [/^(\s*)([A-Za-z_][\w.\-]*)(\s*)(=)/, ["", "variable", "", "delimiter"]],
        [/\s+#.*$/, "comment"],
        [/"/, { token: "string.quote", next: "@dquoted" }],
        [/'[^']*'?/, "string"],
        [/\$\{[^}]*\}|\$[A-Za-z_]\w*/, "variable.predefined"],
        [/\b(true|false|yes|no|null)\b/, "keyword"],
        [/-?\d+(\.\d+)?\b/, "number"],
        [/[^\s#$"']+|\$/, "string"],
        [/\s+/, ""]
      ],
      // Double quotes may span lines in dotenv, so this state may too.
      dquoted: [
        [/\$\{[^}]*\}|\$[A-Za-z_]\w*/, "variable.predefined"],
        [/\\./, "string.escape"],
        [/"/, { token: "string.quote", next: "@pop" }],
        [/[^"\\$]+|\$/, "string"]
      ]
    }
  });
}

(function () {
  if (typeof require === "undefined") { return; }
  require.config({ paths: { vs: "vs" } });
  require(["vs/editor/editor.main"], function () {
    registerDotenv();

    // The TypeScript worker is trimmed from the bundle (fetch-monaco.sh):
    // switch the TS/JS language service off so nothing asks for it.
    // Highlighting comes from the Monarch grammars and stays.
    var ts = (monaco.typescript || (monaco.languages && monaco.languages.typescript));
    if (ts) {
      var off = { completionItems: false, hovers: false, documentSymbols: false, definitions: false,
        references: false, documentHighlights: false, rename: false, diagnostics: false,
        documentRangeFormattingEdits: false, signatureHelp: false, onTypeFormattingEdits: false,
        codeActions: false, inlayHints: false };
      [ts.typescriptDefaults, ts.javascriptDefaults].forEach(function (d) {
        if (!d) { return; }
        if (d.setModeConfiguration) { d.setModeConfiguration(off); }
        if (d.setDiagnosticsOptions) { d.setDiagnosticsOptions({ noSemanticValidation: true, noSyntaxValidation: true }); }
      });
    }

    var dark = window.matchMedia("(prefers-color-scheme: dark)");
    function applyTheme() { monaco.editor.setTheme(dark.matches ? "vs-dark" : "vs"); }
    applyTheme();
    dark.addEventListener("change", applyTheme);

    var editor = monaco.editor.create(document.getElementById("editor"), {
      automaticLayout: true,
      fontFamily: "SF Mono, Menlo, monospace",
      fontSize: 12,
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      renderWhitespace: "selection",
      model: null
    });
    var savedVersion = 0;
    var lastDirty = false;
    var textTimer = null;

    function syncText() {
      clearTimeout(textTimer);
      textTimer = setTimeout(function () {
        var model = editor.getModel();
        if (model) { post({ type: "text", text: model.getValue() }); }
      }, 300);
    }

    function reportDirty() {
      var model = editor.getModel();
      var dirty = !!model && model.getAlternativeVersionId() !== savedVersion;
      if (dirty !== lastDirty) {
        lastDirty = dirty;
        post({ type: "dirty", dirty: dirty });
      }
    }

    function requestSave() {
      var model = editor.getModel();
      if (model) { post({ type: "save", text: model.getValue() }); }
    }
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, requestSave);

    window.wt = {
      // A new file: fresh model, language picked from the path's extension.
      // dirty = the text carries unsaved edits (the pane was re-created).
      open: function (args) {
        var old = editor.getModel();
        var uri = monaco.Uri.file(args.path);
        var existing = monaco.editor.getModel(uri);
        if (existing) { existing.dispose(); }
        var model = monaco.editor.createModel(args.text, undefined, uri);
        model.setEOL(args.text.indexOf("\r\n") >= 0 ? monaco.editor.EndOfLineSequence.CRLF : monaco.editor.EndOfLineSequence.LF);
        editor.setModel(model);
        if (old) { old.dispose(); }
        editor.updateOptions({ readOnly: !!args.readOnly });
        savedVersion = args.dirty ? -1 : model.getAlternativeVersionId();
        lastDirty = !!args.dirty;
        model.onDidChangeContent(function () { reportDirty(); syncText(); });
        editor.focus();
        post({ type: "opened", language: model.getLanguageId() });
      },
      // The file changed on disk and the buffer was clean: replace the text
      // as one undoable edit, so the view (scroll, cursor) mostly stays.
      reload: function (text) {
        var model = editor.getModel();
        if (!model || model.getValue() === text) { return; }
        model.pushEditOperations([], [{ range: model.getFullModelRange(), text: text }], function () { return null; });
        savedVersion = model.getAlternativeVersionId();
        reportDirty();
      },
      // Swift wrote the file: this version is the new save point.
      markSaved: function () {
        var model = editor.getModel();
        if (model) { savedVersion = model.getAlternativeVersionId(); }
        reportDirty();
      },
      // The pane's Save button: same path as Cmd+S.
      requestSave: requestSave,
      currentText: function () {
        var model = editor.getModel();
        return model ? model.getValue() : null;
      },
      focus: function () { editor.focus(); }
    };
    post({ type: "ready" });
  }, function (err) {
    post({ type: "error", message: "Monaco failed to load: " + String(err && err.message || err) });
  });
})();
</script>
</body>
</html>
