<!doctype html>
<!--
  The Files pane's Monaco host page, served by CodeEditorSchemeHandler under
  wtcode://editor/. One model per open file, keyed by the Swift buffer's id
  (stable across a rename), so each keeps its undo stack, cursor and scroll.
  Every edit carries `base`: the disk revision the model was last given
  (show/reload), so Swift can tell an edit typed before a reload landed.

  Swift → page (window.wt):
    show({id, path, text, rev}) | show(null)   put a file on screen / clear it
    reload({id, text, rev, mode})              the disk changed:
        replace — take the text, unless an edit is still unsent: then send
                  that edit (on its old base) and keep it — Swift raises the
                  conflict
        force   — take the text whatever is unsent (Reload from disk)
        rebase  — keep the text, take the new base, send what is unsent
                  (Keep mine)
    rename({id, path})                         the file moved: new language
    close(id)                                  the tab closed
    takePending() → [{id, text, base}]         the unsent edits, handed over
    reveal({id, line, col})                    put the cursor on line:col
                                               (1-based, col in UTF-16) and
                                               scroll it to the centre; a
                                               file not on screen takes it
                                               when it is shown
    focus()                                    the keyboard into the editor
    definitionAtCursor() → Bool                Go to Definition (Ctrl+Cmd+J
                                               from the menu): posts
                                               `definition` for the word at
                                               the cursor; false = no word
    definitionDone(req)                        the definition request `req`
                                               is answered: its busy
                                               underline goes; an older req
                                               is ignored
    usagesAtCursor() → Bool                    Show All Usages (Shift+Cmd+U
                                               from the menu): posts `usages`
                                               for the word at the cursor;
                                               false = no word
    askAI() → Bool                             Ask AI from the menu: posts
                                               `selection` then `askAI` for
                                               the file on screen; false =
                                               no file
    selectionRect() → {x, y, w, h} | null      the selection's box (a caret's
                                               when empty) in page points,
                                               clipped to the editor; null =
                                               no file or scrolled away
    proposeEdit({id, range, text}) → Bool      a suggested change as an
                                               inline diff: the range struck
                                               through, `text` below it;
                                               replaces the file's earlier
                                               one; false = unknown id
    clearProposal(id)                          the diff goes
    applyEdit({id, range, text, expected})     the change as ONE undoable
        → "applied" | "changed" | "missing"    edit (Cmd+Z takes it back),
                                               then the usual `text`
                                               message; refused ("changed")
                                               unless the range still holds
                                               `expected`; "missing" = the
                                               file is not open. The diff
                                               goes when it applies.
    (range = {startLine, startCol, endLine, endCol}, Monaco's: 1-based,
    columns UTF-16, the end exclusive)
  page → Swift (webkit.messageHandlers.wt):
    ready
    text   {id, text, base, now, explicit}     300 ms after typing stops; at
                                               once (now) on a tab switch or
                                               blur; explicit on Cmd+S
    definition {req, id, word, line, col, x, y}  Cmd+click on a word (or
                                               definitionAtCursor): req is a
                                               page counter; line:col is the
                                               click (1-based, UTF-16); x, y
                                               the bottom left of the word in
                                               page points, for the menu
    cursor {id, line, col}                     the cursor moved; at most 10 a
                                               second, the last move always
                                               sent
    usages {id, word, line, col}               the word at the cursor, from
                                               usagesAtCursor or the context
                                               menu's "Show All Usages"
    selection {id, text, truncated, startLine, startCol, endLine, endCol}
                                               the selection changed (every
                                               keystroke moves it); at most
                                               10 a second, the last always
                                               sent; text "" = a caret, cut
                                               at 20 KB (truncated)
    scroll {id}                                the editor scrolled; at most
                                               10 a second, the last always
                                               sent
    askAI  {id}                                Cmd+I, the context menu's
                                               "Ask AI" or askAI(), right
                                               after a `selection` message
                                               with the current selection
    error  {message}

  Monaco's own bindings for the app's navigation chords (spec §10) are
  removed so they reach the app's menu from inside the editor; Cmd held
  over a word underlines it like a link. Cmd+I is the page's own: it
  posts `askAI` and is consumed (no keybinding, so the chord check holds).
-->
<html>
<head>
<meta charset="utf-8">
<!-- Scripts only from the bundle (no inline script, no eval: Monaco's
     loader falls back to importScripts in its workers), no network at all,
     workers from the bundle or Monaco's blob: bootstrap. Monaco injects its
     own <style> elements, hence the inline styles. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<style>
  html, body, #editor { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #ffffff; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e1e; } }
  .wt-def-link { text-decoration: underline; cursor: pointer; }
  .wt-def-busy { text-decoration: underline dotted; }
  .wt-proposal-old { background: rgba(215, 58, 73, 0.2); text-decoration: line-through; }
  .wt-proposal-new { background: rgba(40, 167, 69, 0.18); white-space: pre; overflow: hidden; }
  #missing { display: none; font: 13px -apple-system, sans-serif; color: #888; padding: 16px; }
</style>
</head>
<body>
<div id="editor"></div>
<div id="missing">Monaco is not installed. Run <code>scripts/fetch-monaco.sh</code> and rebuild.</div>
<script src="boot.js"></script>
<script src="languages.js"></script>
<script src="vs/loader.js"></script>
<script src="editor.js"></script>
</body>
</html>
