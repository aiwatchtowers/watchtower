included:
  - Sources
  - Tests

excluded:
  - .build
  - Sources/Resources
  # Generated by internal/db TestDesktopTestSchema (raw migrated DDL).
  - Tests/Support/TestDatabase+Schema.swift

# Strict rules
opt_in_rules:
  # Code quality
  - closure_body_length
  - closure_end_indentation
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  # multiline_arguments — disabled: pure cosmetic, 244 existing violations,
  # and SwiftUI builders read fine with Apple-style argument wrapping.
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Severity overrides
force_cast: warning
force_try: warning
force_unwrapping: warning

# Rule configuration
line_length:
  warning: 150
  error: 300
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 2100
  error: 5000

type_body_length:
  warning: 2000
  error: 5000

function_body_length:
  warning: 80
  error: 200

function_parameter_count:
  warning: 8
  error: 15

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level: 3
  function_level: 3

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  allowed_symbols:
    - _
  excluded:
    # Single-letter identifiers permitted as loop indices, math operands,
    # and short-lived test fixtures. Two-letter common abbreviations live here too.
    - id
    - db
    - ts
    - to
    - a
    - b
    - c
    - d
    - e
    - f
    - g
    - h
    - i
    - j
    - k
    - l
    - m
    - n
    - p
    - q
    - r
    - s
    - t
    - u
    - v
    - w
    - x
    - y
    - z

large_tuple:
  warning: 4
  error: 6

closure_body_length:
  warning: 80
  error: 300

enum_case_associated_values_count:
  warning: 5
  error: 7

type_name:
  min_length:
    warning: 3
    error: 1
  max_length:
    warning: 50
    error: 60

# Keep new Desktop code on the design kit (Sources/DesignKit); legacy uses live in the baseline.
# The rules include only Sources/(Views|App); the kit and the gallery are deliberately not held to them.
custom_rules:
  kit_no_form:
    name: 'kit_no_form'
    regex: '\bForm\s*\{'
    included: '.*/Sources/(Views|App)/.*\.swift'
    message: 'Use SettingsSection / SettingRow (DesignSystem).'
    severity: error
  kit_no_groupbox:
    name: 'kit_no_groupbox'
    regex: '\bGroupBox\b'
    included: '.*/Sources/(Views|App)/.*\.swift'
    message: 'Use .card() or SettingsSection (DesignSystem).'
    severity: error
  kit_no_stock_buttons:
    name: 'kit_no_stock_buttons'
    regex: '\.buttonStyle\(\s*\.bordered(Prominent)?\s*\)'
    included: '.*/Sources/(Views|App)/.*\.swift'
    message: 'Use .kitPrimary / .kitSecondary / .kitQuiet / .kitDestructive.'
    severity: error
  kit_no_segmented_picker:
    name: 'kit_no_segmented_picker'
    regex: '\.pickerStyle\(\s*\.segmented\s*\)'
    included: '.*/Sources/(Views|App)/.*\.swift'
    message: 'Use KitSegmentedPicker (DesignSystem).'
    severity: error
  kit_no_rounded_field:
    name: 'kit_no_rounded_field'
    regex: '\.textFieldStyle\(\s*\.roundedBorder\s*\)'
    included: '.*/Sources/(Views|App)/.*\.swift'
    message: 'Use .textFieldStyle(.kit).'
    severity: error
  kit_no_raw_metrics:
    name: 'kit_no_raw_metrics'
    regex: '\.padding\((\s*\.\w+\s*,)?\s*[1-9][0-9.]*\s*\)|spacing:\s*[1-9][0-9.]*|cornerRadius:\s*[1-9][0-9.]*|\.cornerRadius\(\s*[1-9]|\.system\(size:\s*[0-9]'
    included: '.*/Sources/(Views|App)/.*\.swift'
    message: 'Use Spacing / Radius / IconSize tokens.'
    severity: error
  kit_no_color_opacity:
    name: 'kit_no_color_opacity'
    regex: '\w\.opacity\(\s*0?\.[0-9]'
    included: '.*/Sources/(Views|App)/.*\.swift'
    message: 'Use Fill / ChipTint tokens (view .opacity for dimming is fine).'
    severity: error
  kit_no_rgb_color:
    name: 'kit_no_rgb_color'
    regex: 'Color\(\s*(red:|hex)|NSColor\(\s*(calibratedRed|srgbRed|red):'
    included: '.*/Sources/(Views|App)/.*\.swift'
    message: 'Use semantic system colours.'
    severity: error

reporter: xcode
